<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1060" viewBox="0 0 1800 1060">
<defs>
<style>
.bg{fill:#f8fafc}
.title{font:700 44px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#0f172a}
.sub{font:500 21px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#475569}
.h2{font:700 24px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#0f172a}
.h3{font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#0f172a}
.body{font:500 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#334155}
.small{font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#64748b}
.tiny{font:600 11.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#475569}
.claim{font:700 15.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#0f172a}
.pill{font:600 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#334155}
.arrow{stroke:#64748b;stroke-width:1.35;fill:none;marker-end:url(#arrowhead);stroke-linecap:round}
</style>
<marker id="arrowhead" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto">
  <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
</marker>
<linearGradient id="brand" x1="0" x2="1"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
</defs>
<rect width="1800" height="1060" rx="26" class="bg"/>
<text x="70" y="68" class="title" text-anchor="start">VulnGate Methodology</text><text x="70" y="104" class="sub" text-anchor="start">Evidence-gated claim governance for agentic vulnerability research</text><rect x="70" y="128" width="1660" height="62" rx="18" fill="url(#brand)"/><text x="900" y="168" class="h2" text-anchor="middle" fill="#fff" style="fill:#fff">The model may propose a vulnerability. Evidence decides how far the claim is allowed to go.</text><rect x="70" y="220" width="430" height="120" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="95" y="254" class="h2" text-anchor="start">Host Agent (LLM)</text><text x="95" y="284" class="body" text-anchor="start"><tspan x="95" dy="0">Open-ended reasoning</tspan><tspan x="95" dy="23">attack paths · hypotheses · interpretation</tspan><tspan x="95" dy="23">Proposes claims; cannot self-authorize promotion.</tspan></text><rect x="540" y="220" width="1190" height="120" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="565" y="254" class="h2" text-anchor="start">Deterministic Evidence Layer</text><text x="565" y="284" class="body" text-anchor="start"><tspan x="565" dy="0">source facts · PoC execution · public-information coverage · CVSS consistency · checkpoints / ledger</tspan><tspan x="565" dy="27">Repeatable components preserve evidence semantics and constrain claim promotion.</tspan></text><path d="M500 280 L540 280" class="arrow"/><text x="70" y="392" class="h2" text-anchor="start">S1–S8 Research Lifecycle</text><rect x="70" y="418" width="188" height="132" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="164.0" y="448" class="h3" text-anchor="middle">S1</text><text x="164.0" y="476" class="claim" text-anchor="middle">Attack Surface</text><text x="164.0" y="502" class="tiny" text-anchor="middle"><tspan x="164.0" dy="0">entries · defaults</tspan><tspan x="164.0" dy="20">fix history · rules</tspan></text><path d="M258 484 L278 484" class="arrow"/><rect x="278" y="418" width="188" height="132" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="372.0" y="448" class="h3" text-anchor="middle">S2</text><text x="372.0" y="476" class="claim" text-anchor="middle">Candidates</text><text x="372.0" y="502" class="tiny" text-anchor="middle"><tspan x="372.0" dy="0">mechanisms · chains</tspan><tspan x="372.0" dy="20">candidate matrix</tspan></text><path d="M466 484 L486 484" class="arrow"/><rect x="486" y="418" width="188" height="132" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="580.0" y="448" class="h3" text-anchor="middle">S3</text><text x="580.0" y="476" class="claim" text-anchor="middle">Source Audit</text><text x="580.0" y="502" class="tiny" text-anchor="middle"><tspan x="580.0" dy="0">file:line evidence</tspan><tspan x="580.0" dy="20">residuals · hints</tspan></text><path d="M674 484 L694 484" class="arrow"/><rect x="694" y="418" width="188" height="132" rx="15" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="788.0" y="448" class="h3" text-anchor="middle">S4</text><text x="788.0" y="476" class="claim" text-anchor="middle">PoC Matrix</text><text x="788.0" y="502" class="tiny" text-anchor="middle"><tspan x="788.0" dy="0">version · feature</tspan><tspan x="788.0" dy="20">precondition · authz</tspan></text><path d="M882 484 L902 484" class="arrow"/><rect x="902" y="418" width="188" height="132" rx="15" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="996.0" y="448" class="h3" text-anchor="middle">S5</text><text x="996.0" y="476" class="claim" text-anchor="middle">Novelty</text><text x="996.0" y="502" class="tiny" text-anchor="middle"><tspan x="996.0" dy="0">upstream · disclosure</tspan><tspan x="996.0" dy="20">coverage completeness</tspan></text><path d="M1090 484 L1110 484" class="arrow"/><rect x="1110" y="418" width="188" height="132" rx="15" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="1204.0" y="448" class="h3" text-anchor="middle">S6</text><text x="1204.0" y="476" class="claim" text-anchor="middle">Severity</text><text x="1204.0" y="502" class="tiny" text-anchor="middle"><tspan x="1204.0" dy="0">CVSS · impact</tspan><tspan x="1204.0" dy="20">precondition consistency</tspan></text><path d="M1298 484 L1318 484" class="arrow"/><rect x="1318" y="418" width="188" height="132" rx="15" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/><text x="1412.0" y="448" class="h3" text-anchor="middle">S7</text><text x="1412.0" y="476" class="claim" text-anchor="middle">Finding</text><text x="1412.0" y="502" class="tiny" text-anchor="middle"><tspan x="1412.0" dy="0">self-contained</tspan><tspan x="1412.0" dy="20">local · disclosure-held</tspan></text><path d="M1506 484 L1526 484" class="arrow"/><rect x="1526" y="418" width="188" height="132" rx="15" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/><text x="1620.0" y="448" class="h3" text-anchor="middle">S8</text><text x="1620.0" y="476" class="claim" text-anchor="middle">Evidence Ledger</text><text x="1620.0" y="502" class="tiny" text-anchor="middle"><tspan x="1620.0" dy="0">traceability · exclusions</tspan><tspan x="1620.0" dy="20">round summary</tspan></text><text x="70" y="606" class="h2" text-anchor="start">Evidence Gates and Claim Eligibility</text><rect x="70" y="632" width="176" height="126" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="158.0" y="660" class="h3" text-anchor="middle">G0</text><text x="158.0" y="686" class="claim" text-anchor="middle">Dead Code</text><text x="158.0" y="711" class="small" text-anchor="middle"><tspan x="158.0" dy="0">block unsupported</tspan><tspan x="158.0" dy="18">surface</tspan></text><path d="M246 695 L262 695" class="arrow"/><rect x="262" y="632" width="176" height="126" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="350.0" y="660" class="h3" text-anchor="middle">G1</text><text x="350.0" y="686" class="claim" text-anchor="middle">Reachability</text><text x="350.0" y="711" class="small" text-anchor="middle"><tspan x="350.0" dy="0">untrusted path</tspan><tspan x="350.0" dy="18">required</tspan></text><path d="M438 695 L454 695" class="arrow"/><rect x="454" y="632" width="200" height="126" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="554.0" y="660" class="h3" text-anchor="middle">G1b</text><text x="554.0" y="686" class="claim" text-anchor="middle">Default Config</text><text x="554.0" y="711" class="small" text-anchor="middle"><tspan x="554.0" dy="0">security-gate</tspan><tspan x="554.0" dy="18">semantics</tspan></text><path d="M654 695 L670 695" class="arrow"/><rect x="670" y="632" width="340" height="126" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="840.0" y="660" class="h3" text-anchor="middle">G4</text><text x="840.0" y="686" class="claim" text-anchor="middle">Runtime Evidence</text><text x="840.0" y="711" class="tiny" text-anchor="middle"><tspan x="840.0" dy="0">unexecuted · run-failed · gate-blocked</tspan><tspan x="840.0" dy="18">precondition-unavailable · no-effect</tspan><tspan x="840.0" dy="18">executed-with-effect</tspan></text><path d="M1010 695 L1026 695" class="arrow"/><rect x="1026" y="632" width="292" height="126" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="1172.0" y="660" class="h3" text-anchor="middle">G3</text><text x="1172.0" y="686" class="claim" text-anchor="middle">Novelty Eligibility</text><text x="1172.0" y="711" class="tiny" text-anchor="middle"><tspan x="1172.0" dy="0">candidate-0day · known-family</tspan><tspan x="1172.0" dy="18">upstream-fixed</tspan><tspan x="1172.0" dy="18">unknown-query-failed</tspan></text><path d="M1318 695 L1334 695" class="arrow"/><rect x="1334" y="632" width="242" height="126" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="1455.0" y="660" class="h3" text-anchor="middle">G5</text><text x="1455.0" y="686" class="claim" text-anchor="middle">Consistency</text><text x="1455.0" y="711" class="tiny" text-anchor="middle"><tspan x="1455.0" dy="0">precondition vs CVSS</tspan><tspan x="1455.0" dy="18">impact vs evidence</tspan><tspan x="1455.0" dy="18">downgrade if inconsistent</tspan></text><path d="M1576 695 L1592 695" class="arrow"/><rect x="1592" y="632" width="180" height="126" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/><text x="1682.0" y="670" class="claim" text-anchor="middle">Claim Result</text><text x="1682.0" y="702" class="small" text-anchor="middle"><tspan x="1682.0" dy="0">Confirmed</tspan><tspan x="1682.0" dy="18">Excluded · Pending</tspan></text><rect x="70" y="800" width="1070" height="190" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="95" y="836" class="h2" text-anchor="start">Claim Promotion Must Be Monotonic</text><rect x="92" y="856" width="150" height="38" rx="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="167.0" y="881" class="pill" text-anchor="middle">Hypothesis</text><path d="M242 875 L267 875" class="arrow"/><rect x="267" y="856" width="150" height="38" rx="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="342.0" y="881" class="pill" text-anchor="middle">Source-supported</text><path d="M417 875 L442 875" class="arrow"/><rect x="442" y="856" width="150" height="38" rx="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="517.0" y="881" class="pill" text-anchor="middle">Runtime-confirmed</text><path d="M592 875 L617 875" class="arrow"/><rect x="617" y="856" width="150" height="38" rx="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="692.0" y="881" class="pill" text-anchor="middle">Novelty-qualified</text><path d="M767 875 L792 875" class="arrow"/><rect x="792" y="856" width="150" height="38" rx="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="867.0" y="881" class="pill" text-anchor="middle">Severity-consistent</text><path d="M942 875 L967 875" class="arrow"/><rect x="967" y="856" width="150" height="38" rx="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="1042.0" y="881" class="pill" text-anchor="middle">Claim-eligible</text><text x="95" y="920" class="small" text-anchor="start"><tspan x="95" dy="0">Stronger labels require stronger evidence; missing evidence preserves uncertainty and does not authorize promotion.</tspan><tspan x="95" dy="24">Runtime confirmation is effect-limited: instantiation != RCE; lookup trace != code execution; environment failure != exclusion.</tspan><tspan x="95" dy="24">Negative evidence distinguishes unexecuted, run-failed, precondition-unavailable, and executed-no-effect states.</tspan></text><rect x="1170" y="800" width="560" height="190" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="1195" y="836" class="h2" text-anchor="start">Research Invariants</text><circle cx="1200" cy="869" r="5" fill="#10b981"/><text x="1216" y="874" class="body" text-anchor="start">Evidence Fidelity</text><circle cx="1200" cy="903" r="5" fill="#10b981"/><text x="1216" y="908" class="body" text-anchor="start">Claim Eligibility</text><circle cx="1200" cy="937" r="5" fill="#10b981"/><text x="1216" y="942" class="body" text-anchor="start">Precondition Honesty</text><circle cx="1460" cy="869" r="5" fill="#10b981"/><text x="1476" y="874" class="body" text-anchor="start">Conservative Novelty</text><circle cx="1460" cy="903" r="5" fill="#10b981"/><text x="1476" y="908" class="body" text-anchor="start">Typed Negative Evidence</text><circle cx="1460" cy="937" r="5" fill="#10b981"/><text x="1476" y="942" class="body" text-anchor="start">Reproducible Ledger</text></svg>