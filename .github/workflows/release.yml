name: VulnGate release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Validate and build reproducible release
        run: python3 scripts/release_validate.py --tag "$GITHUB_REF_NAME" --out dist
      - name: Upload release evidence
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: vulngate-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
      - name: Attest release archive
        uses: actions/attest-build-provenance@520d128f165991a6c774bcb264f323e3d70747f4 # v2.2.0
        with:
          subject-path: dist/vulngate-${{ github.ref_name }}.tar.gz
