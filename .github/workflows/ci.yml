name: Codex plugin CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development checks
        run: python -m pip install --disable-pip-version-check --no-input -e '.[dev]'
      - name: Install ripgrep
        shell: bash
        run: |
          if ! command -v rg >/dev/null; then
            if [ "$RUNNER_OS" = "macOS" ]; then
              brew install ripgrep
            else
              sudo apt-get update -qq
              sudo apt-get install -y -qq ripgrep
            fi
          fi
      - name: Regression tests and isolated Codex installer
        run: PYTHONPATH=scripts python3 -m unittest discover -s tests -t tests -v
      - name: Security decision branch coverage
        shell: bash
        run: |
          set -euo pipefail
          coverage_dir="$(mktemp -d)"
          export COVERAGE_FILE="$coverage_dir/.coverage"
          PYTHONPATH=scripts python3 -m coverage run --branch \
            --source=agent.tools.conclusion,agent.orchestrator.gates,agent.sandbox.effects,agent.sandbox.http_observer \
            -m unittest tests.test_gate_transitions tests.test_policy_and_evidence \
            tests.test_regressions tests.test_hardening_controls
          PYTHONPATH=scripts python3 -m coverage report --fail-under=50 \
            --include='*/agent/tools/conclusion.py,*/agent/orchestrator/gates.py,*/agent/sandbox/effects.py,*/agent/sandbox/http_observer.py'
      - name: Source inventory performance smoke
        run: python3 scripts/benchmark_source_inventory.py --sizes 5000 --max-seconds 30
      - name: Branch governance policy
        run: python3 scripts/validate_branch_governance.py --json
      - name: Verify native adaptation
        shell: bash
        run: |
          set -euo pipefail
          python3 macos/bin/patch-vulngate.py --plugin . --verify
      - name: Shell syntax
        shell: bash
        run: |
          bash -n install.sh scripts/run_pipeline.sh scripts/smoke_test.sh
          bash -n macos/run-audit.sh macos/macos-app-recon.sh macos/bin/app2source.sh
      - name: Ruff lint
        run: >-
          python -m ruff check scripts hooks tests
          --select E4,E7,E9,F --ignore E402,F401,F402,F841,F821
      - name: Type check security decision modules
        run: python -m mypy
      - name: ShellCheck
        shell: bash
        run: |
          shellcheck -S error install.sh scripts/run_pipeline.sh scripts/smoke_test.sh \
            macos/run-audit.sh macos/macos-app-recon.sh macos/bin/app2source.sh

  security:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@0fa1882f994fbd81a47ab0804f93354f5ea40147 # v3.28.17
        with:
          languages: python
      - name: Compile Python sources
        run: python3 -m compileall -q scripts hooks tests
      - name: High-confidence secret scan
        run: python3 scripts/secret_scan.py
      - uses: github/codeql-action/analyze@0fa1882f994fbd81a47ab0804f93354f5ea40147 # v3.28.17
