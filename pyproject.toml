[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulngate"
version = "1.3.0"
description = "Evidence-gated vulnerability research helpers for Codex"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff==0.6.9",
  "mypy==1.13.0",
  "coverage==7.6.4",
  "hypothesis==6.115.5",
  "shellcheck-py==0.10.0.1",
]

[tool.setuptools]
packages = []
py-modules = []

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["macos/bin", "scripts/agent/analysis/java_ast"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E501", "F401", "F402", "F821", "F841"]

[tool.mypy]
python_version = "3.10"
files = [
  "scripts/agent/tools/conclusion.py",
  "scripts/agent/tools/evidence_policy.py",
  "scripts/agent/orchestrator/gates.py",
  "scripts/agent/sandbox/effects.py",
  "scripts/agent/sandbox/http_observer.py",
  "scripts/agent/sandbox/isolation.py",
]
follow_imports = "skip"
check_untyped_defs = true
disallow_any_generics = false
no_implicit_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
